<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Draft preview | Network Consultancy</title>
  <style>html,body{height:100%;margin:0;background:#f5f7fa;font-family:Barlow,Arial,sans-serif}.preview-bar{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#162470;color:#fff;font-size:14px}.preview-bar strong{font-weight:700}.preview-bar span{color:#cfe7f4}.preview-frame{display:block;width:100%;height:calc(100% - 44px);margin-top:44px;border:0;background:#fff}.preview-error{padding:48px;color:#162470}</style>
</head>
<body>
  <div class="preview-bar"><strong>Draft preview</strong><span>This is not live. Shared preview link.</span></div>
  <iframe class="preview-frame" id="preview-frame" title="Draft page preview"></iframe>
  <script>
  (async()=>{
    const params=new URLSearchParams(location.search),slug=params.get('slug'),token=params.get('token'),frame=document.getElementById('preview-frame');
    if(!slug||!token){document.body.innerHTML='<div class="preview-error">This preview link is incomplete.</div>';return;}
    try{
      const response=await fetch('/api/public/preview?slug='+encodeURIComponent(slug)+'&token='+encodeURIComponent(token),{cache:'no-store'});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error||'This preview is unavailable.');
      frame.src=slug==='home'?'/':('/'+slug);
      frame.addEventListener('load',()=>{
        const doc=frame.contentDocument,content=result.page.content?.content||{};
        const text=(selector,value)=>{const node=doc.querySelector(selector);if(node&&value)node.textContent=value};
        (content.heroSlides||[]).forEach((item,index)=>{const slide=doc.querySelectorAll('.hero__slide')[index];if(!slide)return;textIn(slide,'.hero__title',item.heading);textIn(slide,'.hero__sub',item.paragraph);const button=slide.querySelector('.hero__btn');if(button){if(item.buttonText)button.textContent=item.buttonText;if(item.buttonUrl)button.href=item.buttonUrl}});
        (content.cards||[]).forEach((item,index)=>{const card=doc.querySelectorAll('.svc-card')[index];if(!card)return;textIn(card,'.svc-card__label',item.heading);textIn(card,'.svc-card__desc',item.paragraph);if(item.imageAlt&&card.querySelector('img'))card.querySelector('img').alt=item.imageAlt});
        if(content.introduction){text('.main-services__title, .ab-intro__title',content.introduction.heading);text('.main-services__intro, .ab-intro p',content.introduction.paragraph)}
        if(content.contactCta){text('.nd-contact__title, .ctf-title',content.contactCta.heading);text('.nd-contact__intro, .ctf-copy, .svc-cta-band__text',content.contactCta.paragraph);const ctaBtn=doc.querySelector('.svc-cta-band__btn');if(ctaBtn){if(content.contactCta.buttonText)ctaBtn.textContent=content.contactCta.buttonText;if(content.contactCta.buttonUrl)ctaBtn.href=content.contactCta.buttonUrl}}
        if(content.heroSlides&&content.heroSlides[0]&&doc.querySelector('.svcs-hero__title')){const item=content.heroSlides[0];text('.svcs-hero__title',item.heading);text('.svcs-hero__sub',item.paragraph);const btn=doc.querySelector('.svcs-hero__cta');if(btn){if(item.buttonText)btn.textContent=item.buttonText;if(item.buttonUrl)btn.href=item.buttonUrl}}
        if(content.heroSlides&&content.heroSlides[0]&&doc.querySelector('.nc-hero__title')){const item=content.heroSlides[0];text('.nc-hero__title',item.heading);text('.nc-hero__sub',item.paragraph);const btn=doc.querySelector('.page-hero__cta-btn');if(btn){if(item.buttonText)btn.textContent=item.buttonText;if(item.buttonUrl)btn.href=item.buttonUrl}}
        if(content.keySolutionAreasIntro){const heading=doc.getElementById('ksa-h');const paragraph=heading&&heading.nextElementSibling;if(heading&&content.keySolutionAreasIntro.heading)heading.textContent=content.keySolutionAreasIntro.heading;if(paragraph&&paragraph.tagName==='P'&&content.keySolutionAreasIntro.paragraph)paragraph.textContent=content.keySolutionAreasIntro.paragraph}
        if(Array.isArray(content.keySolutionAreas)&&content.keySolutionAreas.length){const tabs=[...doc.querySelectorAll('.ksa__tab')];content.keySolutionAreas.forEach((item,index)=>{const tab=tabs[index];if(!tab||!item.title)return;tab.firstChild.textContent=item.title;if(index===0){const title=doc.getElementById('ksa-title');const desc=doc.getElementById('ksa-desc');const img=doc.getElementById('ksa-img');if(title)title.textContent=item.title;if(desc&&item.description)desc.textContent=item.description;if(img&&item.imageUrl)img.src=item.imageUrl}})}
        if(content.whoWeServe){const w=content.whoWeServe;const heading=doc.getElementById('wws-h');const paragraph=heading&&heading.nextElementSibling;if(heading&&w.heading)heading.textContent=w.heading;if(paragraph&&paragraph.tagName==='P'&&w.paragraph)paragraph.textContent=w.paragraph;const img=doc.querySelector('.wws__media img');if(img){if(w.imageUrl)img.src=w.imageUrl;if(w.imageAlt)img.alt=w.imageAlt}if(w.tilesText){const tiles=w.tilesText.split('\n').map(line=>line.trim()).filter(Boolean);doc.querySelectorAll('.wws__item').forEach((node,index)=>{if(tiles[index])node.textContent=tiles[index]})}}
        if(content.businessImpactIntro){const heading=doc.getElementById('biz-h');const paragraph=heading&&heading.nextElementSibling;if(heading&&content.businessImpactIntro.heading)heading.textContent=content.businessImpactIntro.heading;if(paragraph&&paragraph.tagName==='P'&&content.businessImpactIntro.paragraph)paragraph.textContent=content.businessImpactIntro.paragraph}
        if(Array.isArray(content.businessImpact)&&content.businessImpact.length&&frame.contentWindow.__ncSetBusinessImpactSlides){frame.contentWindow.__ncSetBusinessImpactSlides(content.businessImpact)}
        if(content.whyChooseUs){const w=content.whyChooseUs;const heading=doc.getElementById('whyc-h');const paragraphs=doc.querySelectorAll('.whyc__content p');if(heading&&w.heading)heading.textContent=w.heading;if(paragraphs[0]&&w.paragraph1)paragraphs[0].textContent=w.paragraph1;if(paragraphs[1]&&w.paragraph2)paragraphs[1].textContent=w.paragraph2;const img=doc.querySelector('.whyc__media img');if(img){if(w.imageUrl)img.src=w.imageUrl;if(w.imageAlt)img.alt=w.imageAlt}}
        if(content.commonIssues){const c=content.commonIssues;const heading=doc.getElementById('probs-h');const paragraph=heading&&heading.nextElementSibling;if(heading&&c.heading)heading.textContent=c.heading;if(paragraph&&paragraph.tagName==='P'&&c.paragraph)paragraph.textContent=c.paragraph;if(c.itemsText){const labels=c.itemsText.split('\n').map(line=>line.trim()).filter(Boolean);doc.querySelectorAll('.prob__label').forEach((node,index)=>{if(labels[index])node.textContent=labels[index]})}}
        if(Array.isArray(content.servicesList)&&content.servicesList.length){const tabs=[...doc.querySelectorAll('.svl-overview__list-item')];content.servicesList.forEach((item,index)=>{const tab=tabs[index];if(!tab)return;if(item.title){tab.textContent=item.title;tab.dataset.title=item.title}if(item.copy)tab.dataset.copy=item.copy;if(item.imageUrl){tab.dataset.img=item.imageUrl;tab.dataset.webp=item.imageUrl}if(item.imageAlt)tab.dataset.alt=item.imageAlt;if(item.href)tab.dataset.href=item.href;if(index===0){const title=doc.getElementById('svl-overview-title');const copy=doc.getElementById('svl-overview-copy');const img=doc.getElementById('svl-feature-img');const source=doc.getElementById('svl-feature-source');if(title&&item.title)title.textContent=item.title;if(copy&&item.copy)copy.textContent=item.copy;if(img&&item.imageUrl){img.src=item.imageUrl;if(item.imageAlt)img.alt=item.imageAlt}if(source&&item.imageUrl)source.srcset=item.imageUrl}})}
        if (content.highlight) { const points = doc.querySelectorAll('.nd-highlight__copy ul li'); text('.nd-highlight__copy h2', content.highlight.heading); text('.nd-highlight__copy p', content.highlight.paragraph); [content.highlight.point1, content.highlight.point2, content.highlight.point3].forEach((value, index) => { if (points[index] && value) points[index].textContent = value }) }
        (content.expertCards||[]).forEach((item,index)=>{const card=doc.querySelectorAll('.nd-figma-card')[index];if(!card)return;textIn(card,'.nd-figma-card__title',item.heading);textIn(card,'.nd-figma-card__lead',item.leadHeading||item.heading);textIn(card,'.nd-figma-card__text',item.paragraph);if(item.imageAlt&&card.querySelector('img'))card.querySelector('img').alt=item.imageAlt});
        if (content.managedSlides && frame.contentWindow.__ncManagedSlides) { frame.contentWindow.__ncManagedSlides.set(content.managedSlides.map((item)=>({titleHtml:(item.heading||'').replace(/\n/g,'<br>'),titleWide:true,intro:item.intro||'',points:(item.pointsText||'').split('\n').map((line)=>line.trim()).filter(Boolean)}))) }
        // Rebuild (not just patch) the FAQ list so added/removed questions show, not just edited ones.
        if (Array.isArray(content.faqs) && content.faqs.length) {
          const list = doc.getElementById('nd-faq-list') || doc.querySelector('[data-faq-list]');
          if (list) {
            const usesDelegatedClicks = list.hasAttribute('data-faq-list');
            list.innerHTML = '';
            content.faqs.forEach((item, index) => {
              const button = doc.createElement('button');
              button.className = 'nd-faq__item' + (index === 0 ? ' is-open' : '');
              const span = doc.createElement('span'); span.textContent = item.question || '';
              const strong = doc.createElement('strong'); strong.textContent = index === 0 ? '\u2212' : '+';
              button.append(span, strong);
              const panel = doc.createElement('div'); panel.className = 'nd-faq__panel'; panel.textContent = item.answer || '';
              if (index !== 0) panel.hidden = true;
              list.append(button, panel);
            });
            // global.js already delegates .nd-faq__item clicks on pages using [data-faq-list]; binding our own here would double-toggle.
            if (!usesDelegatedClicks) {
              const items = [...list.querySelectorAll('.nd-faq__item')];
              items.forEach((btn) => btn.addEventListener('click', () => {
                const panel = btn.nextElementSibling, open = btn.classList.contains('is-open');
                items.forEach((b) => { b.classList.remove('is-open'); b.querySelector('strong').textContent = '+'; if (b.nextElementSibling) b.nextElementSibling.hidden = true; });
                if (!open) { btn.classList.add('is-open'); btn.querySelector('strong').textContent = '\u2212'; if (panel) panel.hidden = false; }
              }));
            }
          }
        }
        // Rebuild via the carousel's own renderer (window.__ncSetTestimonials from js/cms.js) so added/removed cards recalc slider metrics correctly.
        if (Array.isArray(content.testimonials) && content.testimonials.length && frame.contentWindow.__ncSetTestimonials) {
          frame.contentWindow.__ncSetTestimonials(content.testimonials);
        }
        function textIn(root,selector,value,index=0){const nodes=root.querySelectorAll(selector);if(nodes[index]&&value)nodes[index].textContent=value}
      });
    }catch(error){frame.remove();const message=document.createElement('div');message.className='preview-error';message.textContent=error.message;document.body.append(message)}
  })();
  </script>
</body>
</html>
