<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft preview | Network Consultancy"><link rel="stylesheet" href="/css/global.css"><style>body{margin:0;font-family:Barlow,Arial,sans-serif;background:#f5f7fa;color:#17213b}.preview{max-width:900px;margin:40px auto;padding:32px;background:#fff;border:1px solid #dce3ed}.preview__notice{padding:12px 16px;background:#e8f3f9;border-left:4px solid #0982c5}.preview__item{padding:18px 0;border-bottom:1px solid #dce3ed}.preview__label{color:#0982c5;font-size:12px;font-weight:700;text-transform:uppercase}.preview h1{color:#162470}</style></head><body><main class="preview"><div class="preview__notice">Draft preview. This page is not live.</div><h1 id="preview-title">Loading preview...</h1><div id="preview-content"></div></main><script>
(async()=>{const params=new URLSearchParams(location.search),slug=params.get('slug'),token=params.get('token'),root=document.getElementById('preview-content');const res=await fetch('/api/public/preview?slug='+encodeURIComponent(slug)+'&token='+encodeURIComponent(token));const data=await res.json();if(!res.ok){document.getElementById('preview-title').textContent=data.error||'Preview unavailable';return}document.getElementById('preview-title').textContent=data.page.label+' draft';const content=data.page.content||{};const render=(label,value)=>{if(!value)return;const row=document.createElement('section');row.className='preview__item';row.innerHTML='<div class="preview__label">'+label+'</div><div>'+String(value).replace(/</g,'&lt;')+'</div>';root.append(row)};render('SEO title',content['seo.title']);render('SEO description',content['seo.description']);Object.entries(content.content||{}).forEach(([key,value])=>{if(typeof value==='string')render(key.replace(/[A-Z]/g,' $&'),value)});(content.content?.faqs||[]).forEach((item,i)=>{render('FAQ '+(i+1)+' question',item.question);render('FAQ '+(i+1)+' answer',item.answer)});(content.content?.testimonials||[]).forEach((item,i)=>{render('Testimonial '+(i+1),[item.quote,item.name,item.role].filter(Boolean).join(' - '))})})().catch(()=>{document.getElementById('preview-title').textContent='Preview unavailable'})
</script></body></html>
