<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Draft preview | Network Consultancy</title>
  <style>html,body{height:100%;margin:0;background:#f5f7fa;font-family:Barlow,Arial,sans-serif}.preview-bar{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#162470;color:#fff;font-size:14px}.preview-bar strong{font-weight:700}.preview-bar span{color:#cfe7f4}.preview-frame{display:block;width:100%;height:calc(100% - 44px);margin-top:44px;border:0;background:#fff}.preview-error{padding:48px;color:#162470}</style>
</head>
<body>
  <div class="preview-bar"><strong>Draft preview</strong><span>This is not live. Shared preview link.</span></div>
  <iframe class="preview-frame" id="preview-frame" title="Draft page preview"></iframe>
  <script>
  (async()=>{
    const params=new URLSearchParams(location.search),slug=params.get('slug'),token=params.get('token'),frame=document.getElementById('preview-frame');
    if(!slug||!token){document.body.innerHTML='<div class="preview-error">This preview link is incomplete.</div>';return;}
    try{
      const response=await fetch('/api/public/preview?slug='+encodeURIComponent(slug)+'&token='+encodeURIComponent(token),{cache:'no-store'});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error||'This preview is unavailable.');
      frame.src=slug==='home'?'/':('/'+slug);
      frame.addEventListener('load',()=>{
        const doc=frame.contentDocument,content=result.page.content?.content||{};
        const text=(selector,value)=>{const node=doc.querySelector(selector);if(node&&value)node.textContent=value};
        (content.heroSlides||[]).forEach((item,index)=>{const slide=doc.querySelectorAll('.hero__slide')[index];if(!slide)return;textIn(slide,'.hero__title',item.heading);textIn(slide,'.hero__sub',item.paragraph);const button=slide.querySelector('.hero__btn');if(button){if(item.buttonText)button.textContent=item.buttonText;if(item.buttonUrl)button.href=item.buttonUrl}});
        (content.cards||[]).forEach((item,index)=>{const card=doc.querySelectorAll('.svc-card')[index];if(!card)return;textIn(card,'.svc-card__label',item.heading);textIn(card,'.svc-card__desc',item.paragraph);if(item.imageAlt&&card.querySelector('img'))card.querySelector('img').alt=item.imageAlt});
        if(content.introduction){text('.main-services__title, .ab-intro__title',content.introduction.heading);text('.main-services__intro, .ab-intro p',content.introduction.paragraph)}
        if(content.contactCta){text('.nd-contact__title, .ctf-title',content.contactCta.heading);text('.nd-contact__intro, .ctf-copy',content.contactCta.paragraph)}        if (content.highlight) { const points = doc.querySelectorAll('.nd-highlight__copy ul li'); text('.nd-highlight__copy h2', content.highlight.heading); text('.nd-highlight__copy p', content.highlight.paragraph); [content.highlight.point1, content.highlight.point2, content.highlight.point3].forEach((value, index) => { if (points[index] && value) points[index].textContent = value }) }
        (content.expertCards||[]).forEach((item,index)=>{const card=doc.querySelectorAll('.nd-figma-card')[index];if(!card)return;textIn(card,'.nd-figma-card__title',item.heading);textIn(card,'.nd-figma-card__lead',item.heading);textIn(card,'.nd-figma-card__text',item.paragraph);if(item.imageAlt&&card.querySelector('img'))card.querySelector('img').alt=item.imageAlt});
        if (content.managedSlides && frame.contentWindow.__ncManagedSlides) { frame.contentWindow.__ncManagedSlides.set(content.managedSlides.map((item)=>({titleHtml:(item.heading||'').replace(/\n/g,'<br>'),titleWide:true,intro:item.intro||'',points:(item.pointsText||'').split('\n').map((line)=>line.trim()).filter(Boolean)}))) }        (content.faqs||[]).forEach((item,index)=>{textIn(doc,'.faq-q, .nd-faq__item span',item.question,index);textIn(doc,'.faq-answer, .nd-faq__panel',item.answer,index)});
        function textIn(root,selector,value,index=0){const nodes=root.querySelectorAll(selector);if(nodes[index]&&value)nodes[index].textContent=value}
      });
    }catch(error){frame.remove();const message=document.createElement('div');message.className='preview-error';message.textContent=error.message;document.body.append(message)}
  })();
  </script>
</body>
</html>
